spring.config.import=optional:file:./env.properties
spring.application.name=ScoreBTW API
#Porta del server (Render usa la variabile PORT, fallback a 3001 per sviluppo locale)
server.port=${PORT:3001}
#Disabilita il restart automatico di DevTools per evitare conflitti di porta
spring.devtools.restart.enabled=false
#Configurazione del Database
# Usa variabili d'ambiente in produzione, fallback a valori locali per sviluppo
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scorebtw_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
#Configurazione JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Configurazione JWT
jwt.secret=${JWT_SECRET}
#Configurazione Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.key=${CLOUDINARY_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
#Configurazione Mailgun
mailgun.api.key=${MAILGUN_API}
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.from.address=${MAILGUN_ADDRESS}
rawg.api.key=${RAWG_API_KEY}
rawg.api.url=https://api.rawg.io/api
#Configurazione Multipart File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB